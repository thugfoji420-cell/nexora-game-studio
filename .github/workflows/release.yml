name: Release

# Builds the Windows NSIS installer whenever a version tag (v*) is pushed and
# attaches it to a GitHub Release. `workflow_dispatch` builds the installer as
# an artifact without publishing, so the pipeline can be smoke-tested without
# cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned llama.cpp prebuilt used for the bundled llama-server sidecar
  # (src-tauri/binaries is gitignored, so CI re-provisions it). Bump the tag and
  # SHA256 together when upgrading; the layout assertion below fails loudly if
  # the upstream zip layout ever drifts from tauri.conf.json.
  LLAMA_CPP_TAG: b11696
  LLAMA_CPP_ASSET: llama-b11696-bin-win-cpu-x64.zip
  LLAMA_CPP_SHA256: 1e7c47dff58467540d53e6cf302d83951bcb165afb252c2952ed3872190fc60d

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches project versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG_NAME
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "tag=$tag package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
          if ($tag -ne $pkg -or $tag -ne $tauri -or $tag -ne $cargo) {
            throw "Tag v${tag} does not match project versions (package.json=$pkg, tauri.conf.json=$tauri, Cargo.toml=$cargo). Bump the versions first, then re-tag."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Provision llama.cpp sidecar binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [IO.Path]::GetTempPath() }
          $zip = Join-Path $temp "llama-cpp.zip"
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/${env:LLAMA_CPP_TAG}/${env:LLAMA_CPP_ASSET}"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LLAMA_CPP_SHA256) {
            throw "SHA256 mismatch for ${env:LLAMA_CPP_ASSET}: got ${hash}, expected ${env:LLAMA_CPP_SHA256}"
          }
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Expand-Archive -Path $zip -DestinationPath src-tauri/binaries -Force
          Copy-Item src-tauri/binaries/llama-server.exe src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe

      - name: Assert sidecar layout matches tauri.conf.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $missing = @()
          foreach ($key in $conf.bundle.resources.PSObject.Properties.Name) {
            if (-not $key.StartsWith("binaries/")) { continue }  # blender/*.py ship from the repo
            $rel = $key.Substring("binaries/".Length)
            if (-not (Test-Path (Join-Path src-tauri/binaries $rel))) { $missing += $rel }
          }
          foreach ($bin in $conf.bundle.externalBin) {
            $sidecar = [IO.Path]::GetFileName($bin) + "-x86_64-pc-windows-msvc.exe"
            if (-not (Test-Path (Join-Path src-tauri/binaries $sidecar))) { $missing += $sidecar }
          }
          if ($missing.Count -gt 0) {
            throw "Sidecar provisioning incomplete - missing: $($missing -join ', ')"
          }
          $count = (Get-ChildItem src-tauri/binaries).Count
          Write-Host "Sidecar layout OK ($count files)"

      - name: Install frontend dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secrets:check

      - name: Frontend tests
        # Rust tests are intentionally not run in CI: several unit tests assert
        # that local AI engine installs exist (C:\AI\... discovery probes) and
        # only pass on a configured development machine.
        run: npm run test:js

      - name: Build installer
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-installer-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
